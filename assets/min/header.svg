<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FDE2E4"/><stop offset=".55" stop-color="#E2E2F9"/><stop offset="1" stop-color="#D7ECF7"/></linearGradient>
<filter id="b" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="38"/></filter>
<clipPath id="c"><rect width="720" height="300" rx="28"/></clipPath>
<style>
.a{animation:f1 9s ease-in-out infinite alternate} .b{animation:f2 11s ease-in-out infinite alternate}
@keyframes f1{to{transform:translate(120px,40px)}} @keyframes f2{to{transform:translate(-140px,-30px)}}
.t{font-family:-apple-system,BlinkMacSystemFont,&quot;Apple SD Gothic Neo&quot;,&quot;Pretendard&quot;,&quot;Noto Sans KR&quot;,sans-serif;fill:#2B2B3A} .in{opacity:0;animation:up 1.1s .2s ease forwards} .in2{opacity:0;animation:up 1.1s .6s ease forwards}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
</style></defs>
<g clip-path="url(#c)"><rect width="720" height="300" fill="url(#bg)"/>
<circle class="a" cx="160" cy="80" r="110" fill="#FFB3C1" filter="url(#b)" opacity=".7"/>
<circle class="b" cx="560" cy="230" r="120" fill="#B8C0FF" filter="url(#b)" opacity=".7"/></g>
<g class="in"><text x="56" y="150" class="t" font-size="64" font-weight="800" letter-spacing="-2">seunghw2</text></g>
<g class="in2"><text x="58" y="200" class="t" font-size="26" font-weight="500" opacity=".65">Backend Developer · App Maker</text>
<text x="58" y="244" class="t" font-size="22" opacity=".5">내가 매일 쓸 앱을 직접 만듭니다.</text></g>
</svg>